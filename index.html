<script>
    // 1. Инициализация MAX Bridge (оставляем как было)
    const bridge = window.WebApp;
    if (bridge) {
        bridge.ready();
        const user = bridge.initDataUnsafe?.user;
        if (user && user.first_name) {
            const greetingEl = document.getElementById('greeting');
            greetingEl.textContent = `Привет, ${user.first_name}! Ваша аптечка готова.`;
            greetingEl.classList.add('visible');
        }
    }

    // 2. Адрес вашего сервера
    // ПОКА локальный. Позже замените на адрес задеплоенного сервера (например, https://api.вашдомен.ru)
    const API_URL = 'http://localhost:3000';

    // 3. Функция для запросов к серверу с initData
    async function apiRequest(path, options = {}) {
        const initData = bridge ? bridge.initData : '';
        const headers = {
            'Content-Type': 'application/json',
            'x-max-init-data': initData,
            ...(options.headers || {})
        };
        const response = await fetch(`${API_URL}${path}`, { ...options, headers });
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || 'Ошибка запроса');
        }
        return response.json();
    }

    // 4. Отрисовка списка (аналогично тому, что было, но данные приходят с сервера)
    const listEl = document.getElementById('medList');
    const emptyEl = document.getElementById('emptyState');

    function getStatus(expiryDateStr) {
        const today = new Date();
        const expiry = new Date(expiryDateStr);
        const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return 'red';
        if (diffDays < 30) return 'yellow';
        return 'green';
    }

    function renderList(medicines) {
        listEl.innerHTML = '';
        if (!medicines || medicines.length === 0) {
            emptyEl.style.display = 'block';
            return;
        }
        emptyEl.style.display = 'none';
        medicines.forEach(med => {
            const status = getStatus(med.expiryDate);
            const card = document.createElement('div');
            card.className = 'med-card';
            card.innerHTML = `
                <div class="med-info">
                    <h3>${med.name}</h3>
                    <div class="expiry">Годен до: ${med.expiryDate}</div>
                </div>
                <div class="med-status status-${status}"></div>
            `;
            listEl.appendChild(card);
        });
    }

    // 5. Загрузка данных при старте
    async function loadMedicines() {
        try {
            const data = await apiRequest('/api/medicines', { method: 'POST' });
            renderList(data.medicines);
        } catch (e) {
            console.error('Не удалось загрузить лекарства:', e);
            renderList([]); // покажем пустое состояние
        }
    }

    // 6. Кнопка «+» — пока простой prompt, позже заменим на форму
    document.getElementById('addBtn').addEventListener('click', async () => {
        const name = prompt('Название лекарства:');
        if (!name) return;
        const expiryDate = prompt('Срок годности (ГГГГ-ММ-ДД):');
        if (!expiryDate) return;
        try {
            await apiRequest('/api/medicines/add', {
                method: 'POST',
                body: JSON.stringify({ name, expiryDate })
            });
            await loadMedicines(); // обновляем список
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    });

    // 7. Старт
    loadMedicines();
</script>
